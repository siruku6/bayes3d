[build-system]
requires = ["setuptools>=67", "setuptools_scm>=8", "torch>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes3d"
authors = [
    {name = "Nishad Gothoskar", email = "nishadg@mit.edu"},
]
description = "Probabilistic inference in 3D."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "artificial-intelligence",
    "probabilistic-programming",
    "bayesian-inference",
    "differentiable-programming"
    ]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "distinctipy",
    "genjax==0.10.3",
    "graphviz",
    "imageio",
    "matplotlib",
    "meshcat",
    "natsort",
    "numpy",
    "open3d",
    "opencv-python",
    "plyfile",
    "pyliblzfse",
    "pyransac3d",
    "tensorflow-probability",
    "trimesh",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "jupyterlab",
    "joblib",
    "flax",
    "mkdocs",
    "mkdocs-material",
    "pyliblzfse",
]
docker = [
    "distinctipy==1.3.4",
    "flax==0.10.4",
    "graphviz==0.21",
    "imageio==2.37.3",
    "ipython==8.39.0",
    "jax==0.5.3",
    "jaxlib==0.5.3",
    "jax-cuda12-plugin==0.5.3",
    "jax-cuda12-pjrt==0.5.3",
    "jupyter==1.1.1",
    "natsort==8.4.0",
    "numpy<2.0.0",
    "matplotlib==3.10.9",
    "opencv-python-headless==4.11.0.86",
    "open3d==0.19.0",
    "meshcat==0.3.2",
    "plyfile==1.1.3",
    "pyliblzfse==0.4.1",
    "pyransac3d==0.6.0",
    "setuptools==81.0.0",
    "tensorflow-probability==0.23.0",
    "tqdm==4.67.3",
    "trimesh==4.12.1",
]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv"
]
# extend-include = ["*.ipynb"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
exclude = ["bayes3d/_mkl/*.py"]
extend-select = ["I"]
select = ["E4", "E7", "E9", "F"]

# F403 disables errors from `*` imports, which we currently use heavily.
ignore = ["F403"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.setuptools_scm]


[tool.setuptools.packages.find]
include = ["bayes3d"]
namespaces = false
